title = "Betterleaks"

# betterleaksMinVersion indicates the minimum betterleaks version required.
# If the running version is older, a warning will be logged.
betterleaksMinVersion = "1.6.0"

prefilter = '''
filter.matchesAny(get(attributes, "path", ""), [
r"""(?:^|/)\.env$""",
r"""(?:^|/)\.venv$""",
r"""(?:^|/)\..*cache$""",
r"""(?:^|/).*_files$""",
r"""(?:^|/)\.quarto$""",
r"""(?:^|/).*\.html$""",
])
'''

[extend]
useDefault = true

[allowlist]
description = "Ignore specific bad historical commits entirely"
commits = ["3d3c42e5aac5ba805825da76410c181273ba90b1"]
